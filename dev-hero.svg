<svg width="800" height="420" viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="screenGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

  <rect width="800" height="420" rx="18" fill="url(#bg)"/>

  <!-- floating code symbols -->
  <text x="70" y="90" font-family="Consolas, Menlo, monospace" font-weight="bold" font-size="34" fill="#38bdf8" opacity="0.6">
    &lt;/&gt;
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -14; 0 0" dur="4s" repeatCount="indefinite"/>
  </text>

  <text x="660" y="110" font-family="Consolas, Menlo, monospace" font-weight="bold" font-size="30" fill="#a855f7" opacity="0.55">
    { }
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 12; 0 0" dur="3.2s" repeatCount="indefinite"/>
  </text>

  <text x="620" y="330" font-family="Consolas, Menlo, monospace" font-weight="bold" font-size="26" fill="#34d399" opacity="0.5">
    npm run deploy
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -10; 0 0" dur="3.6s" repeatCount="indefinite"/>
  </text>

  <text x="90" y="330" font-family="Consolas, Menlo, monospace" font-weight="bold" font-size="26" fill="#f59e0b" opacity="0.5">
    kubectl apply
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 10; 0 0" dur="4.4s" repeatCount="indefinite"/>
  </text>

  <!-- desk -->
  <rect x="150" y="330" width="500" height="16" rx="4" fill="#334155"/>
  <rect x="180" y="346" width="16" height="50" fill="#334155"/>
  <rect x="600" y="346" width="16" height="50" fill="#334155"/>

  <!-- laptop base -->
  <rect x="300" y="300" width="200" height="14" rx="4" fill="#475569"/>
  <!-- laptop screen -->
  <rect x="330" y="180" width="140" height="120" rx="6" fill="#1e293b" stroke="#475569" stroke-width="4"/>
  <rect x="340" y="190" width="120" height="98" rx="3" fill="url(#screenGlow)" opacity="0.15"/>

  <!-- code lines on screen -->
  <g stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.9">
    <line x1="348" y1="202" x2="400" y2="202"/>
    <line x1="348" y1="214" x2="440" y2="214"/>
    <line x1="358" y1="226" x2="420" y2="226"/>
    <line x1="348" y1="238" x2="410" y2="238"/>
    <line x1="358" y1="250" x2="430" y2="250"/>
  </g>
  <!-- blinking cursor -->
  <rect x="358" y="260" width="10" height="12" fill="#38bdf8">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- person silhouette -->
  <circle cx="400" cy="150" r="26" fill="#f1c27d"/>
  <path d="M360 300 Q360 230 400 225 Q440 230 440 300 Z" fill="#0ea5e9"/>
  <!-- arms toward keyboard -->
  <path d="M370 260 Q380 290 400 296" stroke="#f1c27d" stroke-width="10" stroke-linecap="round" fill="none"/>
  <path d="M430 260 Q420 290 400 296" stroke="#f1c27d" stroke-width="10" stroke-linecap="round" fill="none"/>

  <!-- chair -->
  <rect x="380" y="300" width="40" height="60" rx="6" fill="#1e293b" opacity="0.6"/>

  <!-- small plant -->
  <g transform="translate(240,270)">
    <rect x="0" y="30" width="26" height="26" rx="4" fill="#7c3aed"/>
    <path d="M13 30 Q13 0 0 -6" stroke="#22c55e" stroke-width="4" fill="none"/>
    <path d="M13 30 Q13 -4 26 -10" stroke="#22c55e" stroke-width="4" fill="none"/>
    <path d="M13 30 Q13 4 13 -14" stroke="#22c55e" stroke-width="4" fill="none"/>
  </g>

  <!-- coffee cup -->
  <g transform="translate(540,280)">
    <rect x="0" y="10" width="26" height="22" rx="3" fill="#e2e8f0"/>
    <path d="M26 14 h8 a6 6 0 0 1 0 12 h-8" stroke="#e2e8f0" stroke-width="3" fill="none"/>
    <path d="M6 6 Q10 -2 4 -8" stroke="#94a3b8" stroke-width="2" fill="none" opacity="0.7">
      <animate attributeName="d" values="M6 6 Q10 -2 4 -8; M6 6 Q2 -2 8 -8; M6 6 Q10 -2 4 -8" dur="2.5s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
